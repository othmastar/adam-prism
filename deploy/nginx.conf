# ═══════════════════════════════════════════
# Nginx Config - Adam Prism
# Reverse proxy للـ API والـ Web UI
# [M13-M14] Added rate limiting + TLS configuration
# ═══════════════════════════════════════════

upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web:3000;
}

# [M13] Rate limiting zone — 30 requests per second per IP
limit_req_zone $binary_remote_addr zone=adam_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=adam_ws:10m rate=10r/s;

# ─── HTTP server (redirect to HTTPS) ─────────
server {
    listen 80;
    server_name adam-prism.online _;
    # Redirect to HTTPS (works only when SSL cert exists)
    return 301 https://$host$request_uri;
}

# ─── HTTP server (development / fallback) ─────
server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static files للـ Web UI
    location /_next/static {
        proxy_pass http://web_upstream;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        proxy_pass http://web_upstream;
        expires 30d;
    }

    # API reverse proxy — [M13] with rate limiting
    location /api/ {
        limit_req zone=adam_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket للـ chat — [M13] with rate limiting
    location /ws/ {
        limit_req zone=adam_ws burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SSE stream
    location /api/engine/stream {
        proxy_pass http://api_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
    }

    # Health endpoint
    location /api/engine/health {
        proxy_pass http://api_upstream;
    }

    # WhatsApp webhook (POST + GET للتأكيد)
    location /webhook/whatsapp {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # باقي المسارات → Web UI
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/adam-prism-access.log;
    error_log /var/log/nginx/adam-prism-error.log;
}

# ─── HTTPS server (production) ─────────────────────────────
# This server block is included dynamically via entrypoint.sh
# when SSL certs exist at /etc/nginx/ssl/